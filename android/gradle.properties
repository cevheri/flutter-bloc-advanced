org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Built-in Kotlin is on: the app and every plugin in pubspec.lock support it.
# Keep this line; without it the Flutter migrator adds android.builtInKotlin=false again.
android.builtInKotlin=true
# Must stay false on Flutter 3.47: the Flutter Gradle plugin does not support the new AGP DSL yet (flutter/flutter#180137).
android.newDsl=false
